name: Temporary homepage copy QA
on:
  push:
    branches: [main]

jobs:
  home-copy-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: |
          npm install
          npm install --no-save puppeteer-core@24
          npm run build
      - name: Start preview
        run: |
          nohup npx astro preview --host 127.0.0.1 --port 4321 >/tmp/home-copy-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/home-copy-preview.log
          exit 1
      - name: Render and verify homepage copy
        run: |
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import { execSync } from 'node:child_process';
          const executablePath = execSync('command -v google-chrome || command -v chromium || command -v chromium-browser').toString().trim();
          const browser = await puppeteer.launch({ headless: true, executablePath, args: ['--no-sandbox','--disable-dev-shm-usage'] });
          const widths = [1440,1024,768,430,390,360];
          const required = [
            'Dalla gestione ordinaria alle operazioni straordinarie, dalla riorganizzazione alla pianificazione patrimoniale e successoria, fino al contenzioso tributario: lo Studio Piras interviene dove competenza tecnica e strategia devono procedere insieme.',
            'Dal 1993 lo Studio Piras affianca imprese, imprenditori e professionisti nella gestione degli adempimenti e delle strategie in materia fiscale, societaria e finanziaria, nonché nelle operazioni straordinarie che richiedono una valutazione integrata di più profili.',
            'L’esperienza maturata negli anni ha consolidato un metodo fondato sull’analisi approfondita e globale di ogni fattispecie, sull’indipendenza di giudizio e sulla massima trasparenza delle soluzioni prospettate.',
            'Il rapporto con il cliente è improntato alla continuità e al confronto diretto, anche quando la complessità dell’incarico richiede il coordinamento con professionisti in ambito legale, notarile o specialistico.',
            'Tradurre le decisioni in atti, dati quantitativi, adempimenti e coordinamento operativo, affiancando il cliente in ogni fase della loro attuazione.',
            'Le sfide più complesse raramente appartengono a una sola disciplina. Quando l’incarico lo richiede, lo Studio coordina la propria attività con professionisti in ambito legale, notarile, finanziario e specialistico, garantendo una visione unitaria dell’operazione e un unico referente strategico per il cliente.'
          ];
          const forbidden = [
            'dalla riorganizzazione dei gruppi alla pianificazione patrimoniale',
            'Dal 1993 lo Studio Piras affianca imprese, imprenditori e professionisti nella gestione delle questioni fiscali',
            'Tradurre la scelta in atti, numeri, adempimenti',
            'Le questioni più complesse raramente appartengono a una sola disciplina.'
          ];
          for (const width of widths) {
            const page = await browser.newPage();
            await page.setViewport({ width, height: 1000, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:4321/', { waitUntil: 'networkidle0' });
            await page.evaluate(() => document.fonts.ready);
            const state = await page.evaluate(({ required, forbidden }) => {
              const text = document.body.innerText;
              const studioCopy = document.querySelector('section.rule .body-copy');
              return {
                requiredPresent: required.every(item => text.includes(item)),
                forbiddenAbsent: forbidden.every(item => !text.includes(item)),
                threeStudioParagraphs: studioCopy ? [...studioCopy.querySelectorAll(':scope > p')].slice(0,3).length === 3 : false,
                overflow: document.documentElement.scrollWidth > window.innerWidth + 1,
                claimPresent: text.includes('Decisioni complesse, risposte chiare.'),
                studioCtaPresent: text.includes('Scopri lo Studio'),
                methodTitlePresent: text.includes('Il valore della consulenza nasce dal metodo.'),
                analysisPresent: text.includes('ANALISI'),
                strategyPresent: text.includes('STRATEGIA'),
                executionPresent: text.includes('ESECUZIONE'),
                areasPresent: text.includes('Aree di attività'),
                integratedPresent: text.includes('Competenze integrate')
              };
            }, { required, forbidden });
            if (!state.requiredPresent || !state.forbiddenAbsent || !state.threeStudioParagraphs || state.overflow || !state.claimPresent || !state.studioCtaPresent || !state.methodTitlePresent || !state.analysisPresent || !state.strategyPresent || !state.executionPresent || !state.areasPresent || !state.integratedPresent) {
              throw new Error(`Homepage QA failure ${width}: ${JSON.stringify(state)}`);
            }
            console.log(JSON.stringify({ width, ...state }));
            await page.close();
          }
          await browser.close();
          NODE
