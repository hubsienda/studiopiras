name: Verifica sito
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installa dipendenze
        run: npm install
      - name: Verifica e build
        run: npm run build
      - name: Controllo testo pubblico indesiderato
        run: |
          ! grep -RniE 'RP Consulting|Read more|Published on|Learn more|Services' dist --include='*.html'
          ! find dist -type d -path '*/en*' -print -quit | grep .
      - name: Controllo identità visiva
        run: |
          test -f dist/favicon.png
          grep -Rql 'href="/favicon.png"' dist --include='*.html'
          ! grep -Rqi 'favicon.svg' dist
          ! grep -Rqi 'fonts.googleapis.com' dist
          grep -Rqi 'Cinzel' dist/_astro
