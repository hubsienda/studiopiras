name: Temporary cookie preferences QA
on:
  push:
    branches: [main]

jobs:
  cookie-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: |
          npm install
          npm install --no-save puppeteer-core@24
          npm run build
      - name: Verify tracker audit constraints
        run: |
          set -euo pipefail
          ! grep -RniE '<iframe|<script[^>]+src=|localStorage|sessionStorage|document\.cookie|gtag\(|fbq\(|googletagmanager|youtube\.com/embed|player\.vimeo' src --exclude='cookie.astro' --exclude='privacy.astro' --exclude-dir=node_modules
      - name: Start preview
        run: |
          nohup npx astro preview --host 127.0.0.1 --port 4321 >/tmp/cookie-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cookie-preview.log
          exit 1
      - name: Render and verify privacy preferences
        run: |
          mkdir -p qa
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import { execSync } from 'node:child_process';

          const executablePath = execSync('command -v google-chrome || command -v chromium || command -v chromium-browser').toString().trim();
          const browser = await puppeteer.launch({ headless: true, executablePath, args: ['--no-sandbox','--disable-dev-shm-usage'] });
          const widths = [1440,1280,1024,768,430,390,360];

          for (const width of widths) {
            const page = await browser.newPage();
            await page.setViewport({ width, height: 1000, deviceScaleFactor: 1 });
            const origins = new Set();
            page.on('request', request => {
              try { origins.add(new URL(request.url()).origin); } catch {}
            });

            await page.goto('http://127.0.0.1:4321/', { waitUntil: 'networkidle0' });
            await page.evaluate(() => document.fonts.ready);

            const firstVisit = await page.evaluate(() => ({
              dialogOpen: document.querySelector('[data-cookie-preferences-dialog]')?.hasAttribute('open') ?? false,
              bannerLikeVisible: [...document.querySelectorAll('button')].some(el => ['Accetta tutto','Rifiuta tutto','Personalizza'].includes((el.textContent || '').trim())),
              cookie: document.cookie,
              localStorageLength: localStorage.length,
              sessionStorageLength: sessionStorage.length,
              overflow: document.documentElement.scrollWidth > window.innerWidth + 1,
              footerControl: Boolean(document.querySelector('[data-cookie-preferences-open]')),
            }));

            if (firstVisit.dialogOpen) throw new Error(`Preferences dialog unexpectedly open on first visit at ${width}`);
            if (firstVisit.bannerLikeVisible) throw new Error(`Meaningless consent controls visible at ${width}`);
            if (firstVisit.cookie || firstVisit.localStorageLength || firstVisit.sessionStorageLength) throw new Error(`Unexpected client storage at ${width}: ${JSON.stringify(firstVisit)}`);
            if (firstVisit.overflow || !firstVisit.footerControl) throw new Error(`Initial layout/footer control failure at ${width}`);

            const thirdPartyOrigins = [...origins].filter(origin => origin !== 'http://127.0.0.1:4321');
            if (thirdPartyOrigins.length) throw new Error(`Third-party requests before interaction at ${width}: ${thirdPartyOrigins.join(', ')}`);

            await page.$eval('[data-cookie-preferences-open]', el => el.scrollIntoView({ block: 'center' }));
            await page.click('[data-cookie-preferences-open]');
            await page.waitForSelector('dialog[data-cookie-preferences-dialog][open]');

            const openState = await page.evaluate(() => {
              const dialog = document.querySelector('[data-cookie-preferences-dialog]');
              const rect = dialog?.getBoundingClientRect();
              const switchEl = dialog?.querySelector('[role="switch"]');
              const close = dialog?.querySelector('[data-cookie-preferences-close]');
              const dismiss = dialog?.querySelector('.cookie-preferences-dismiss');
              const privacy = dialog?.querySelector('a[href="/privacy/"]');
              const cookie = dialog?.querySelector('a[href="/cookie/"]');
              const active = document.activeElement;
              return {
                width: rect?.width ?? 0,
                height: rect?.height ?? 0,
                switchChecked: switchEl?.getAttribute('aria-checked'),
                switchDisabled: switchEl instanceof HTMLButtonElement ? switchEl.disabled : false,
                closeHeight: close?.getBoundingClientRect().height ?? 0,
                dismissHeight: dismiss?.getBoundingClientRect().height ?? 0,
                privacyVisible: Boolean(privacy),
                cookieVisible: Boolean(cookie),
                focusInsideDialog: dialog instanceof HTMLDialogElement ? dialog.contains(active) : false,
                overflow: document.documentElement.scrollWidth > window.innerWidth + 1,
              };
            });

            if (openState.switchChecked !== 'true' || !openState.switchDisabled) throw new Error(`Necessary switch failure at ${width}`);
            if (!openState.privacyVisible || !openState.cookieVisible || !openState.focusInsideDialog) throw new Error(`Dialog content/focus failure at ${width}`);
            if (openState.closeHeight < 44 || openState.dismissHeight < 44) throw new Error(`Touch target below 44px at ${width}: ${JSON.stringify(openState)}`);
            if (openState.width > width - 16 || openState.height > 984 || openState.overflow) throw new Error(`Dialog viewport failure at ${width}: ${JSON.stringify(openState)}`);

            await page.screenshot({ path: `qa/preferences-${width}.png`, fullPage: false });

            await page.keyboard.press('Escape');
            await page.waitForFunction(() => !document.querySelector('[data-cookie-preferences-dialog]')?.hasAttribute('open'));
            const focusReturned = await page.evaluate(() => document.activeElement?.matches('[data-cookie-preferences-open]') ?? false);
            if (!focusReturned) throw new Error(`Focus not returned after Escape at ${width}`);

            await page.click('[data-cookie-preferences-open]');
            await page.click('[data-cookie-preferences-close]');
            const finalState = await page.evaluate(() => ({
              open: document.querySelector('[data-cookie-preferences-dialog]')?.hasAttribute('open') ?? false,
              cookie: document.cookie,
              localStorageLength: localStorage.length,
              sessionStorageLength: sessionStorage.length,
            }));
            if (finalState.open || finalState.cookie || finalState.localStorageLength || finalState.sessionStorageLength) throw new Error(`Close/storage failure at ${width}: ${JSON.stringify(finalState)}`);

            console.log(JSON.stringify({ width, firstVisit, openState, origins:[...origins] }));
            await page.close();
          }

          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cookie-preferences-responsive-qa
          path: qa/*.png
          if-no-files-found: error
