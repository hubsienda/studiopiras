name: Temporary contacts final QA
on:
  push:
    branches: [main]

jobs:
  contacts-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: |
          npm install
          npm install --no-save puppeteer-core@24
          npm run build
      - name: Start preview
        run: |
          nohup npx astro preview --host 127.0.0.1 --port 4321 >/tmp/contacts-final.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/contatti/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/contacts-final.log
          exit 1
      - name: Verify computed styles and spacing
        run: |
          mkdir -p qa
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import { execSync } from 'node:child_process';
          const executablePath = execSync('command -v google-chrome || command -v chromium || command -v chromium-browser').toString().trim();
          const browser = await puppeteer.launch({ headless: true, executablePath, args: ['--no-sandbox','--disable-dev-shm-usage'] });
          const widths=[1440,1280,1024,768,430,390,360];
          const snapshots=[];
          for (const width of widths) {
            const page=await browser.newPage();
            await page.setViewport({width,height:1100,deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:4321/contatti/', {waitUntil:'networkidle0'});
            await page.evaluate(() => document.fonts.ready);
            const state=await page.evaluate(() => {
              const articles=[...document.querySelectorAll('section.rule article')];
              const q=articles[0], m=articles[1];
              const qAddress=q.querySelector('.office-address');
              const qDetails=q.querySelector('.office-contact-details');
              const qPhoneP=qDetails?.querySelector('p:first-child');
              const qPhone=qPhoneP?.querySelector('a[href^="tel:"]');
              const qEmailP=qDetails?.querySelector('p:last-child');
              const qEmail=qEmailP?.querySelector('a[href^="mailto:"]');
              const mAddress=m.querySelector('.office-address');
              const mDetails=m.querySelector('.office-contact-details');
              const mEmailP=mDetails?.querySelector('p');
              const mEmail=mEmailP?.querySelector('a[href^="mailto:"]');
              const info=(el)=>{const s=getComputedStyle(el);return {fontSize:s.fontSize,lineHeight:s.lineHeight,fontFamily:s.fontFamily,fontWeight:s.fontWeight};};
              const qMap=q.querySelector('a[target="_blank"]');
              const mMap=m.querySelector('a[target="_blank"]');
              const qImg=q.querySelector('img');
              const mImg=m.querySelector('img');
              return {
                qAddress:info(qAddress),qPhone:info(qPhone),qEmail:info(qEmail),mAddress:info(mAddress),mEmail:info(mEmail),
                qGap:qPhoneP.getBoundingClientRect().top-qAddress.getBoundingClientRect().bottom,
                mGap:mEmailP.getBoundingClientRect().top-mAddress.getBoundingClientRect().bottom,
                qAddressText:qAddress.textContent.trim(),mAddressText:mAddress.textContent.trim(),
                qPhoneText:qPhoneP.textContent.trim(),qEmailText:qEmailP.textContent.trim(),mEmailText:mEmailP.textContent.trim(),
                qPhoneHref:qPhone.getAttribute('href'),qEmailHref:qEmail.getAttribute('href'),mEmailHref:mEmail.getAttribute('href'),
                qMapText:qMap.textContent.trim(),mMapText:mMap.textContent.trim(),qMapHref:qMap.getAttribute('href'),mMapHref:mMap.getAttribute('href'),
                qImg:{src:qImg.getAttribute('src'),width:qImg.getAttribute('width'),height:qImg.getAttribute('height'),cls:qImg.getAttribute('class')},
                mImg:{src:mImg.getAttribute('src'),width:mImg.getAttribute('width'),height:mImg.getAttribute('height'),cls:mImg.getAttribute('class')},
                overflow:document.documentElement.scrollWidth>window.innerWidth+1
              };
            });
            const styles=[state.qAddress,state.qPhone,state.qEmail,state.mAddress,state.mEmail];
            const sameTypography=styles.every(s=>s.fontSize===styles[0].fontSize&&s.lineHeight===styles[0].lineHeight&&s.fontFamily===styles[0].fontFamily&&s.fontWeight===styles[0].fontWeight);
            const gapEqual=Math.abs(state.qGap-state.mGap)<0.1;
            const gapTwenty=Math.abs(state.qGap-20)<0.1;
            if (!sameTypography || !gapEqual || !gapTwenty || state.overflow ||
                state.qAddressText!=='Via Sicilia, 65 – 09045 Quartu Sant’Elena (CA)' ||
                state.mAddressText!=='Via G.B. Pergolesi, 2 – 20124 Milano' ||
                state.qPhoneText!=='Telefono: +39 070 861888' ||
                state.qEmailText!=='Email: info@studiopiras.it' || state.mEmailText!=='Email: info@studiopiras.it' ||
                state.qPhoneHref!=='tel:+39070861888' || state.qEmailHref!=='mailto:info@studiopiras.it' || state.mEmailHref!=='mailto:info@studiopiras.it' ||
                state.qMapText!=='Apri la mappa →' || state.mMapText!=='Apri la mappa →' ||
                state.qMapHref!=='https://maps.app.goo.gl/iVhLexuVpJkG6cqR8' || state.mMapHref!=='https://maps.app.goo.gl/swAubEgGiwc8RyTy7' ||
                state.qImg.src!=='/quartu.JPG' || state.qImg.width!=='1200' || state.qImg.height!=='800' || !state.qImg.cls.includes('office-photo--quartu') ||
                state.mImg.src!=='/milano.png' || state.mImg.width!=='547' || state.mImg.height!=='350' || !state.mImg.cls.includes('office-photo--milano')) {
              throw new Error(`CONTACTS_QA_${width}=${JSON.stringify(state)}`);
            }
            console.log(`FINAL_COMPUTED_${width}=${JSON.stringify({fontSize:styles[0].fontSize,lineHeight:styles[0].lineHeight,fontFamily:styles[0].fontFamily,qGap:state.qGap,mGap:state.mGap})}`);
            snapshots.push({width,state});
            await page.screenshot({path:`qa/contatti-${width}.png`,fullPage:true});
            await page.close();
          }
          console.log('FINAL_CONTACTS_QA=PASS');
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: contacts-final-responsive-qa
          path: qa/*.png
          if-no-files-found: error
