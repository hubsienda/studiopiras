name: Temporary Studio copy QA
on:
  push:
    branches: [main]

jobs:
  studio-copy-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: |
          npm install
          npm install --no-save puppeteer-core@24
          npm run build
      - name: Start preview
        run: |
          nohup npx astro preview --host 127.0.0.1 --port 4321 >/tmp/studio-copy-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/studio/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/studio-copy-preview.log
          exit 1
      - name: Render and verify Studio copy
        run: |
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import { execSync } from 'node:child_process';
          const executablePath = execSync('command -v google-chrome || command -v chromium || command -v chromium-browser').toString().trim();
          const browser = await puppeteer.launch({ headless: true, executablePath, args: ['--no-sandbox','--disable-dev-shm-usage'] });
          const widths = [1440,1024,768,430,390,360];
          const expectedIntro = [
            "Dal 1993 lo Studio Piras sostiene aziende, liberi professionisti, imprenditori e gruppi nell'elaborazione di strategie tributarie, societarie e finanziarie, oltre che nelle operazioni straordinarie che necessitano di una visione d'insieme coordinata.",
            "Il percorso maturato sul campo ha affinato un approccio basato sull'esame completo di ciascuna fattispecie, sull'autonomia di valutazione e sulla linearità dei percorsi risolutivi offerti.",
            "La relazione con il cliente mantiene una dimensione fiduciaria e personalizzata, facendosi carico di guidare la sinergia con esperti di ambito legale, notarile o tecnico nei casi a più elevata complessità."
          ];
          const expectedSpaces = 'Gli ambienti nei quali lavoriamo sono parte del modo in cui accogliamo il cliente: spazi pensati per il comfort, la riservatezza e un rapporto professionale diretto.';
          const forbidden = [
            'Dal 1993 lo Studio Piras affianca imprese, imprenditori e professionisti',
            'L’esperienza maturata nel tempo ha consolidato un metodo',
            'Il rapporto con il cliente resta diretto e personale',
            'spazi pensati per il confronto, la riservatezza'
          ];
          for (const width of widths) {
            const page = await browser.newPage();
            await page.setViewport({ width, height: 1000, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:4321/studio/', { waitUntil: 'networkidle0' });
            await page.evaluate(() => document.fonts.ready);
            const state = await page.evaluate(({ expectedIntro, expectedSpaces, forbidden }) => {
              const text = document.body.innerText;
              const textLower = text.toLocaleLowerCase('it');
              const firstRule = document.querySelector('section.rule');
              const intro = firstRule?.querySelector('.body-copy');
              const introParagraphs = intro ? [...intro.querySelectorAll(':scope > p')].map(p => p.textContent?.trim()) : [];
              const spacesSection = [...document.querySelectorAll('section')].find(s => s.textContent?.includes('Gli Spazi dello Studio'));
              const spacesCopy = spacesSection?.querySelector('.body-copy')?.textContent?.trim() ?? '';
              const photo = document.querySelector('img[src="/4.JPG"]');
              const galleryCta = document.querySelector('a[href="/gallery/"][class*="editorial-link"]');
              const galleryImageLink = document.querySelector('a[href="/gallery/"] img[src="/2.JPG"]');
              return {
                introExact: introParagraphs.length === 3 && expectedIntro.every((item, i) => introParagraphs[i] === item),
                spacesExact: spacesCopy === expectedSpaces,
                forbiddenAbsent: forbidden.every(item => !text.includes(item)),
                headingPresent: text.includes('Un rapporto diretto, una lettura unitaria dei problemi.'),
                raffaelePresent: text.includes('Raffaele Piras'),
                photoPresent: Boolean(photo),
                spacesTitlePresent: textLower.includes('gli spazi dello studio'),
                galleryCtaPresent: galleryCta?.textContent?.trim() === 'Dentro lo Studio',
                galleryImageLinkPresent: Boolean(galleryImageLink),
                overflow: document.documentElement.scrollWidth > window.innerWidth + 1
              };
            }, { expectedIntro, expectedSpaces, forbidden });
            if (!state.introExact || !state.spacesExact || !state.forbiddenAbsent || !state.headingPresent || !state.raffaelePresent || !state.photoPresent || !state.spacesTitlePresent || !state.galleryCtaPresent || !state.galleryImageLinkPresent || state.overflow) {
              throw new Error(`Studio QA failure ${width}: ${JSON.stringify(state)}`);
            }
            console.log(JSON.stringify({ width, ...state }));
            await page.close();
          }
          await browser.close();
          NODE
