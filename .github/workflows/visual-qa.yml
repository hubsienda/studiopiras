name: Temporary Gallery and contacts rendered QA
on:
  push:
    branches: [main]

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and build
        run: |
          npm install
          npm install --no-save puppeteer-core@24
          npm run build
      - name: Verify source scope and removed image reference
        run: |
          set -euo pipefail
          ! grep -Rni 'studio-12' src public --exclude-dir=node_modules
          test -f public/quartu.JPG
          test -f public/milano.png
          test ! -e public/gallery/studio-12.JPG
      - name: Start local site
        run: |
          nohup npx astro preview --host 127.0.0.1 --port 4321 > /tmp/studio-piras-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/gallery/ >/dev/null && curl -fsS http://127.0.0.1:4321/contatti/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/studio-piras-preview.log
          exit 1
      - name: Render, measure and test lightbox
        run: |
          mkdir -p qa
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import { execSync } from 'node:child_process';

          const executablePath = execSync('command -v google-chrome || command -v chromium || command -v chromium-browser').toString().trim();
          const browser = await puppeteer.launch({ headless: true, executablePath, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
          const widths = [1440, 1280, 1024, 768, 430, 390];
          const expected = [
            '/gallery/studio-01.jpg','/gallery/studio-02.JPG','/gallery/studio-03.JPG','/gallery/studio-04.JPG',
            '/gallery/studio-05.JPG','/gallery/studio-06.JPG','/gallery/studio-07.JPG','/gallery/studio-08.JPG',
            '/gallery/studio-09.JPG','/gallery/studio-10.JPG','/gallery/studio-11.JPG','/gallery/studio-13.JPG',
            '/gallery/studio-14.jpeg','/gallery/studio-15.JPG','/gallery/studio-16.JPG','/gallery/studio-17.JPG','/gallery/studio-18.JPG'
          ];

          const loadVisibleImages = async (page) => {
            await page.evaluate(() => {
              document.querySelectorAll('img[src]:not([src=""])').forEach((img) => { img.loading = 'eager'; });
            });
            await page.waitForFunction(() => [...document.querySelectorAll('img[src]:not([src=""])')].every((img) => img.complete && img.naturalWidth > 0), { timeout: 30000 });
            await page.evaluate(() => document.fonts.ready);
          };

          for (const width of widths) {
            const page = await browser.newPage();
            await page.setViewport({ width, height: 1200, deviceScaleFactor: 1 });

            await page.goto('http://127.0.0.1:4321/gallery/', { waitUntil: 'networkidle0' });
            await loadVisibleImages(page);
            const gallery = await page.evaluate((expectedSequence) => {
              const triggers = [...document.querySelectorAll('[data-gallery-trigger]')];
              const srcs = triggers.map((el) => el.getAttribute('data-src'));
              const get = (src) => triggers.find((el) => el.getAttribute('data-src') === src);
              const eleven = get('/gallery/studio-11.JPG');
              const thirteen = get('/gallery/studio-13.JPG');
              const ten = get('/gallery/studio-10.JPG');
              const standard = get('/gallery/studio-02.JPG');
              const pairSources = [...(eleven?.closest('.gallery-row')?.querySelectorAll('[data-gallery-trigger]') ?? [])].map((el) => el.getAttribute('data-src'));
              const r11 = eleven?.getBoundingClientRect();
              const r13 = thirteen?.getBoundingClientRect();
              const r10 = ten?.getBoundingClientRect();
              const rs = standard?.getBoundingClientRect();
              return {
                count: triggers.length,
                srcs,
                sequenceMatches: JSON.stringify(srcs) === JSON.stringify(expectedSequence),
                pairSources,
                elevenTop: r11?.top ?? 0,
                thirteenTop: r13?.top ?? 0,
                elevenWidth: r11?.width ?? 0,
                thirteenWidth: r13?.width ?? 0,
                tenWidth: r10?.width ?? 0,
                standardWidth: rs?.width ?? 0,
                overflow: document.documentElement.scrollWidth > window.innerWidth + 1,
                brokenImages: [...document.querySelectorAll('img[src]:not([src=""])')].filter((img) => !img.complete || img.naturalWidth === 0).length,
              };
            }, expected);

            if (gallery.count !== 17 || !gallery.sequenceMatches) throw new Error(`Gallery sequence/count failure at ${width}: ${gallery.srcs.join(', ')}`);
            if (gallery.pairSources.join('|') !== '/gallery/studio-11.JPG|/gallery/studio-13.JPG') throw new Error(`11/13 pair mismatch at ${width}`);
            if (gallery.overflow || gallery.brokenImages) throw new Error(`Gallery overflow/broken image at ${width}`);
            if (width >= 768 && Math.abs(gallery.elevenTop - gallery.thirteenTop) > 1) throw new Error(`11/13 not side-by-side at ${width}`);
            if (width >= 768 && Math.abs(gallery.elevenWidth - gallery.thirteenWidth) > 1) throw new Error(`11/13 widths differ at ${width}`);
            if (width >= 768 && Math.abs(gallery.tenWidth - gallery.standardWidth) > 1) throw new Error(`studio-10 width differs from standard at ${width}`);

            const elevenSelector = '[data-gallery-trigger][data-src="/gallery/studio-11.JPG"]';
            await page.$eval(elevenSelector, (el) => el.scrollIntoView({ block: 'center' }));
            await page.click(elevenSelector);
            await page.waitForSelector('dialog[open]');
            let lightboxSrc = await page.$eval('[data-gallery-image]', (img) => img.getAttribute('src'));
            if (lightboxSrc !== '/gallery/studio-11.JPG') throw new Error(`Lightbox open mismatch at ${width}`);
            await page.click('[data-gallery-next]');
            lightboxSrc = await page.$eval('[data-gallery-image]', (img) => img.getAttribute('src'));
            if (lightboxSrc !== '/gallery/studio-13.JPG') throw new Error(`Lightbox 11→13 failed at ${width}`);
            await page.click('[data-gallery-prev]');
            lightboxSrc = await page.$eval('[data-gallery-image]', (img) => img.getAttribute('src'));
            if (lightboxSrc !== '/gallery/studio-11.JPG') throw new Error(`Lightbox 13→11 failed at ${width}`);
            await page.click('[data-gallery-close]');
            await page.screenshot({ path: `qa/gallery-${width}.png`, fullPage: true });

            await page.goto('http://127.0.0.1:4321/contatti/', { waitUntil: 'networkidle0' });
            await loadVisibleImages(page);
            const contacts = await page.evaluate(() => {
              const quartu = document.querySelector('img[src="/quartu.JPG"]');
              const milano = document.querySelector('img[src="/milano.png"]');
              const q = quartu.getBoundingClientRect();
              const m = milano.getBoundingClientRect();
              const qs = getComputedStyle(quartu);
              const ms = getComputedStyle(milano);
              return {
                qHeight: q.height, mHeight: m.height, qTop: q.top, mTop: m.top, qBottom: q.bottom, mBottom: m.bottom,
                qFit: qs.objectFit, mFit: ms.objectFit, qPosition: qs.objectPosition, mPosition: ms.objectPosition,
                overflow: document.documentElement.scrollWidth > window.innerWidth + 1,
                brokenImages: [...document.querySelectorAll('img[src]:not([src=""])')].filter((img) => !img.complete || img.naturalWidth === 0).length,
              };
            });

            if (Math.abs(contacts.qHeight - contacts.mHeight) > 0.5) throw new Error(`Contact heights differ at ${width}: ${contacts.qHeight}/${contacts.mHeight}`);
            if (contacts.qFit !== 'cover' || contacts.mFit !== 'cover') throw new Error(`Contact object-fit mismatch at ${width}`);
            if (contacts.overflow || contacts.brokenImages) throw new Error(`Contacts overflow/broken image at ${width}`);
            if (width >= 768 && (Math.abs(contacts.qTop - contacts.mTop) > 1 || Math.abs(contacts.qBottom - contacts.mBottom) > 1)) throw new Error(`Contact tops/bottoms differ at ${width}`);

            console.log(JSON.stringify({ width, gallery, contacts }));
            await page.screenshot({ path: `qa/contatti-${width}.png`, fullPage: true });
            await page.close();
          }

          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-contacts-responsive-qa
          path: qa/*.png
          if-no-files-found: error
