name: Temporary rendered publications QA
on:
  push:
    branches: [main]

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and build
        run: |
          npm install
          npm run build
      - name: Start local site
        run: |
          nohup npx astro preview --host 127.0.0.1 --port 4321 > /tmp/studio-piras-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/download/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/studio-piras-preview.log
          exit 1
      - name: Check pages and all PDF links
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:4321/approfondimenti/ >/tmp/approfondimenti.html
          curl -fsS http://127.0.0.1:4321/download/ >/tmp/download.html
          grep -F 'Analisi per decisioni che meritano tempo.' /tmp/approfondimenti.html
          grep -F 'Questioni complesse, analisi chiare.' /tmp/approfondimenti.html
          grep -F 'Consulta le pubblicazioni' /tmp/approfondimenti.html
          ! grep -F 'Una sezione editoriale, non un notiziario fiscale.' /tmp/approfondimenti.html
          ! grep -F 'Gli approfondimenti saranno pubblicati progressivamente.' /tmp/approfondimenti.html
          for pdf in \
            Studio_Piras_01_Pianificazione_Passaggio_Generazionale_6p.pdf \
            Studio_Piras_02_Trust_Pianificazione_Successoria_6p-1.pdf \
            Studio_Piras_03_Holding_Passaggio_Generazionale_8p.pdf \
            Studio_Piras_04_Societa_Semplice_Godimento_Beni_8p.pdf \
            Studio_Piras_05_Trust_Holding_Fiscalita_Internazionale_9p.pdf \
            Studio_Piras_06_Holding_Strumento_Strategico_Gruppo_9p.pdf \
            Studio_Piras_07_Trust_o_Societa_Semplice_9p.pdf \
            Studio_Piras_08_Composizione_Negoziata_Crisi_Impresa_9p.pdf; do
              curl -fsSI "http://127.0.0.1:4321/articoli/$pdf" | grep -E '^HTTP/.* 200'
          done
      - name: Capture required responsive widths
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          mkdir -p qa
          for width in 1440 1280 1024 768 430 390 360; do
            "$BROWSER" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=${width},1600 --screenshot="qa/approfondimenti-${width}.png" http://127.0.0.1:4321/approfondimenti/
            "$BROWSER" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=${width},2400 --screenshot="qa/download-${width}.png" http://127.0.0.1:4321/download/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: publications-responsive-qa
          path: qa/*.png
          if-no-files-found: error
